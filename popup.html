<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YouTube Declutter</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #0f0f0f;
        --line: #e5e5e5;
        --switch-off: #b3b3b3;
        --switch-on: #cc0000;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181818;
          --text: #f1f1f1;
          --line: #303030;
          --switch-off: #5c5c5c;
          --switch-on: #ff4e45;
        }
      }

      body {
        width: 340px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.3 system-ui, sans-serif;
      }

      fieldset {
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }

      fieldset:disabled {
        opacity: 0.45;
      }

      fieldset:disabled label,
      fieldset:disabled input {
        cursor: default;
      }

      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 44px;
        padding: 0 16px;
        border-top: 1px solid var(--line);
        cursor: pointer;
      }

      #main {
        min-height: 52px;
        border-top: 0;
        font-size: 15px;
        font-weight: 600;
      }

      input {
        appearance: none;
        flex: none;
        position: relative;
        width: 36px;
        height: 20px;
        margin: 0;
        border-radius: 10px;
        background: var(--switch-off);
        cursor: pointer;
        transition: background 0.15s;
      }

      input::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #ffffff;
        transition: transform 0.15s;
      }

      input:checked {
        background: var(--switch-on);
      }

      input:checked::after {
        transform: translateX(16px);
      }

      input:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <label id="main">YouTube Declutter <input id="enabled" type="checkbox" /></label>
    <fieldset id="settings"></fieldset>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
